<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>{% block title %}لوحة التحكم{% endblock %} — DO + WG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="فتح القائمة">☰</button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🛡️</span>
      <div class="brand-text">
        <strong>DO + WG</strong>
        <small>لوحة التحكم</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-item"><span class="nav-icon">🏠</span><span>الرئيسية</span></a>
      <a href="/snapshots-page" class="nav-item"><span class="nav-icon">📸</span><span>Snapshots</span></a>
      <a href="/events-page" class="nav-item"><span class="nav-icon">📜</span><span>الأحداث</span></a>
      <a href="/alerts-page" class="nav-item"><span class="nav-icon">🔔</span><span>التنبيهات</span></a>
    </nav>

    <div class="sidebar-footer">
      <small>واجهة إدارية — للاستخدام الداخلي</small>
    </div>
  </aside>

  <main class="content">
    <header class="content-header">
      <h1>{% block title_text %}لوحة التحكم{% endblock %}</h1>
    </header>
    <section class="content-body">
      {% block content %}{% endblock %}
    </section>
    <footer class="content-footer">
      <small>DO + WireGuard Manager</small>
    </footer>
  </main>

  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const toggle = document.getElementById('sidebarToggle');
      const open = () => { sidebar.classList.add('open'); backdrop.classList.add('show'); };
      const close = () => { sidebar.classList.remove('open'); backdrop.classList.remove('show'); };

      toggle.addEventListener('click', () =>
        sidebar.classList.contains('open') ? close() : open()
      );
      backdrop.addEventListener('click', close);
      sidebar.querySelectorAll('.nav-item').forEach(a =>
        a.addEventListener('click', () => {
          if (window.innerWidth <= 900) close();
        })
      );
      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
